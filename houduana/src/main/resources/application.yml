server:
  port: 8083

spring:
  # ====== 数据源配置 ======
  datasource:
    url: jdbc:mysql://localhost:3306/digital_ticket?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # ====== JPA 配置 ======
  jpa:
    hibernate:
      ddl-auto: update          # ✅ 已改回 update，保留现有数据，只更新表结构
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # ====== Redis 配置（高并发抢票分布式锁 / 热点缓存） ======
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

  # ====== Jackson 日期格式配置 ======
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# ====== JWT 配置 ======
jwt:
  secret: ${JWT_SECRET:}
  expire: 86400000

# ====== 支付配置（默认模拟；配置支付宝沙箱后启用） ======
pay:
  enabled: ${PAY_ENABLED:false}
  channel: ${PAY_CHANNEL:mock}
  app-id: ${PAY_APP_ID:}
  private-key: ${PAY_PRIVATE_KEY:}
  alipay-public-key: ${PAY_PUBLIC_KEY:}
  server-url: ${PAY_SERVER_URL:https://openapi-sandbox.dl.alipaydev.com/gateway.do}
  notify-url: ${PAY_NOTIFY_URL:}
  return-url: ${PAY_RETURN_URL:}
  encrypt-key: ${PAY_ENCRYPT_KEY:}
  pay-timeout-minutes: ${PAY_TIMEOUT_MINUTES:30}

# ====== 日志配置 ======
logging:
  level:
    com.scenic: debug
    org.springframework.web: debug

# ====== 天气服务配置 ======
weather:
  qweather-key: ${QWEATHER_KEY:}

# ====== 本地 AI 智能体（Ollama） ======
agent:
  ollama-url: http://localhost:11434
  model: ticket-agent
  embed-model: nomic-embed-text
