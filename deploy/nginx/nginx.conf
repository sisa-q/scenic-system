# ============================================================
# 智慧景区系统 Nginx 配置（生产）
#   :80   游客端 web（dist 静态资源 + /api、/ws 反向代理）
#   :8081 管理端 admin（dist 静态资源 + /api、/ws 反向代理）
# 后端容器名 backend，端口 8083（与 docker-compose.yml 对齐）
# ============================================================
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # 后端上游（docker-compose 服务名）
    upstream scenic_backend {
        server backend:8083;
    }

    # ---------- 游客端 ----------
    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html/web;
        index index.html;

        gzip on;
        gzip_types text/plain text/css application/javascript application/json image/svg+xml;
        gzip_min_length 1k;

        # history 路由回退到 index.html
        location / {
            try_files $uri $uri/ /index.html;
        }

        # Service Worker (PWA)：禁止缓存，必须每次拉取最新版本
        location = /service-worker.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Service-Worker-Allowed "/";
            expires -1;
        }

        # REST API 反向代理
        location /api/ {
            proxy_pass http://scenic_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSocket（客流大屏实时推送 /ws/flow）
        location /ws/ {
            proxy_pass http://scenic_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }

    # ---------- HTTPS（生产启用；证书放到 deploy/nginx/certs/ 下） ----------
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        root /usr/share/nginx/html/web;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html;
        }

        # Service Worker (PWA)：禁止缓存，必须每次拉取最新版本
        location = /service-worker.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Service-Worker-Allowed "/";
            expires -1;
        }
        location /api/ {
            proxy_pass http://scenic_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        location /ws/ {
            proxy_pass http://scenic_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }

    # ---------- 管理端 ----------
    server {
        listen 8081;
        server_name _;

        root /usr/share/nginx/html/admin;
        index index.html;

        gzip on;
        gzip_types text/plain text/css application/javascript application/json image/svg+xml;
        gzip_min_length 1k;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /api/ {
            proxy_pass http://scenic_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ws/ {
            proxy_pass http://scenic_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}